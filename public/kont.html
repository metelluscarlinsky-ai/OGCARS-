<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kont Mwen - OGCARS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.kont-wrap{max-width:520px;margin:40px auto;padding:0 20px}
.kont-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px}
.tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--bg-soft);padding:4px;border-radius:12px}
.tab{flex:1;padding:10px;text-align:center;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;transition:all .2s;color:var(--text-soft)}
.tab.active{background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--text)}
.tab-content{display:none}.tab-content.active{display:block}
.orders-wrap{max-width:800px;margin:30px auto;padding:0 20px}
.order-row{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
</style>
</head>
<body>
<header class="navbar"><div class="nav-inner">
  <a href="/" class="logo">OG<span>CARS</span></a>
  <nav class="nav-links"><a href="/">Akèy</a>
    <a href="https://wa.me/50932687915" target="_blank" class="btn-wa">WhatsApp</a></nav>
  <button id="themeToggle" class="theme-toggle">&#9788;</button>
</div></header>
<div class="kont-wrap" id="authSection"><div class="kont-card">
  <div class="tabs"><div class="tab active" data-tab="login">Konekte</div><div class="tab" data-tab="register">Enskri</div></div>
  <div id="alertBox"></div>
  <div class="tab-content active" id="tab-login">
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Modpas</label><input type="password" name="password" required></div>
      <button type="submit" class="btn btn-primary btn-block">Konekte</button>
    </form>
  </div>
  <div class="tab-content" id="tab-register">
    <form id="registerForm">
      <div class="form-group"><label>Non konplè</label><input type="text" name="nom" required minlength="2"></div>
      <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
      <div class="form-group"><label>Telefòn (opsyonèl)</label><input type="tel" name="phone" placeholder="509XXXXXXXX"></div>
      <div class="form-group"><label>Modpas (6 karaktè min)</label><input type="password" name="password" minlength="6" required></div>
      <button type="submit" class="btn btn-primary btn-block">Enskri</button>
    </form>
  </div>
</div></div>
<div class="orders-wrap" id="ordersSection" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
    <h2 style="letter-spacing:-.5px;">Kòmand Mwen</h2>
    <button class="btn btn-secondary" id="logoutBtn">Dekonekte</button>
  </div>
  <div id="userInfo" style="margin-bottom:20px;color:var(--text-soft);font-size:14px;"></div>
  <div id="ordersList"></div>
</div>
<a href="https://wa.me/50932687915" class="wa-float" target="_blank">WA</a>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
