<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detay Machin - OGCARS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.detail-wrap{max-width:1100px;margin:40px auto;padding:0 20px}
.detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:30px}
.detail-img{width:100%;border-radius:16px;aspect-ratio:16/10;object-fit:cover;background:#eee}
.detail-side{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;height:fit-content}
.detail-side h1{font-size:26px;margin-bottom:8px;letter-spacing:-0.5px}
.detail-price{font-size:32px;font-weight:900;color:var(--accent);margin:12px 0;letter-spacing:-1px}
.detail-specs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.spec{background:var(--bg-soft);padding:10px 12px;border-radius:10px}
.spec-label{font-size:11px;text-transform:uppercase;color:var(--text-soft);letter-spacing:.5px}
.spec-value{font-weight:600;font-size:14px;margin-top:2px}
.detail-desc{color:var(--text-soft);margin:20px 0;line-height:1.7}
.detail-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.detail-desc h3{color:var(--text);margin-bottom:8px}
@media(max-width:800px){.detail-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="navbar"><div class="nav-inner">
  <a href="/" class="logo">OG<span>CARS</span></a>
  <nav class="nav-links"><a href="/">Akèy</a><a href="/kont.html">Kont</a>
    <a href="https://wa.me/50932924776" target="_blank" class="btn-wa">WhatsApp</a></nav>
  <button id="themeToggle" class="theme-toggle">&#9788;</button>
</div></header>
<div class="detail-wrap"><div id="detailContent"><div class="loading">Ap chaje...</div></div></div>
<a href="https://wa.me/50932924776" class="wa-float" target="_blank">WA</a>
<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const carId = params.get('id');
const content = document.getElementById('detailContent');
async function loadCar() {
  if (!carId) { content.innerHTML = '<div class="empty">Machin pa jwenn.</div>'; return; }
  try {
    const r = await fetch('/api/cars/' + carId);
    if (!r.ok) throw new Error();
    renderCar(await r.json());
  } catch (e) { content.innerHTML = '<div class="empty">Machin pa jwenn.</div>'; }
}
function renderCar(car) {
  const waMsg = encodeURIComponent('Bonjou, mwen enterese nan ' + car.mark + ' ' + car.modele + ' (' + (car.ane||'') + '). Pri: ' + formatPri(car.pri));
  const badgeCls = car.statut === 'disponib' ? 'dispo' : car.statut === 'vandi' ? 'vandi' : 'rez';
  content.innerHTML =
    '<div class="detail-grid">' +
      '<div><img class="detail-img" src="' + (car.foto||'') + '" alt="">' +
      '<div class="detail-desc"><h3>Deskripsyon</h3>' + escapeHTML(car.deskripsyon || 'Pa gen deskripsyon.') + '</div></div>' +
      '<aside class="detail-side">' +
        '<h1>' + escapeHTML(car.mark) + ' ' + escapeHTML(car.modele) + '</h1>' +
        '<div style="color:var(--text-soft);font-size:14px;">Ane ' + (car.ane||'-') + ' · ' + escapeHTML(car.koule||'-') + '</div>' +
        '<div class="detail-price">' + formatPri(car.pri) + '</div>' +
        '<span class="badge badge-' + badgeCls + '">' + escapeHTML(car.statut) + '</span>' +
        '<div class="detail-specs">' +
          '<div class="spec"><div class="spec-label">Kilometraj</div><div class="spec-value">' + escapeHTML(car.km||'-') + '</div></div>' +
          '<div class="spec"><div class="spec-label">Transmisyon</div><div class="spec-value">' + escapeHTML(car.transmisyon||'-') + '</div></div>' +
          '<div class="spec"><div class="spec-label">Gaz</div><div class="spec-value">' + escapeHTML(car.gaz||'-') + '</div></div>' +
          '<div class="spec"><div class="spec-label">Koulè</div><div class="spec-value">' + escapeHTML(car.koule||'-') + '</div></div>' +
        '</div>' +
        '<div class="detail-actions">' +
          (car.statut === 'disponib' ? '<a class="btn btn-primary btn-block" href="/peman.html?car_id=' + car.id + '">Achte Kounye a</a>' : '<button class="btn btn-primary btn-block" disabled>Pa Disponib</button>') +
          '<a class="btn btn-secondary btn-block" target="_blank" href="https://wa.me/50932924776?text=' + waMsg + '">Pale ak Vandè</a>' +
        '</div>' +
      '</aside>' +
    '</div>';
}
loadCar();
</script>
</body>
</html>
