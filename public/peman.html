<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peman - OGCARS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
.peman-wrap{max-width:560px;margin:40px auto;padding:0 20px}
.peman-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}
.car-summary{display:flex;gap:14px;padding:12px;background:var(--bg-soft);border-radius:12px;margin-bottom:20px;align-items:center}
.car-summary img{width:90px;height:70px;object-fit:cover;border-radius:8px;background:#eee}
.method-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.method-opt{padding:16px;border:2px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;font-weight:600}
.method-opt:hover{border-color:var(--accent)}
.method-opt.active{border-color:var(--accent);background:rgba(255,107,0,.08)}
.method-opt small{display:block;color:var(--text-soft);font-weight:400;font-size:11px;margin-top:4px}
.notice{background:#fef3c7;color:#92400e;padding:14px;border-radius:10px;margin:14px 0;font-size:14px;line-height:1.7}
.notice.error{background:#fee2e2;color:#991b1b}
.notice.ok{background:#dcfce7;color:#166534}
</style>
</head>
<body>
<header class="navbar"><div class="nav-inner">
  <a href="/" class="logo">OG<span>CARS</span></a>
  <nav class="nav-links"><a href="/">Akèy</a>
    <a href="https://wa.me/50932924776" target="_blank" class="btn-wa">WhatsApp</a></nav>
  <button id="themeToggle" class="theme-toggle">&#9788;</button>
</div></header>
<div class="peman-wrap"><div class="peman-card" id="pemanCard">
  <h2 style="letter-spacing:-.5px;margin-bottom:16px;">Peman</h2>
  <div id="pemanContent"><div class="loading">Ap chaje...</div></div>
</div></div>
<script src="/js/app.js"></script>
<script src="/js/peman.js"></script>
</body>
</html>
